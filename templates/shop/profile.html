<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Ferremas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3 class="card-title mb-0">Mi Perfil</h3>
                    </div>
                    <div class="card-body text-center">
                        <img src="https://via.placeholder.com/150" class="rounded-circle mb-3" alt="Profile Image">
                        <h4>{{ user.username }}</h4>
                        <p>{{ user.email }}</p>
                        <a href="{% url 'logout' %}" class="btn btn-danger">Cerrar Sesión</a>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3 class="card-title mb-0">Información Personal</h3>
                    </div>
                    <div class="card-body">
                        <p><strong>Nombre de usuario:</strong> {{ user.username }}</p>
                        <p><strong>Email:</strong> {{ user.email }}</p>
                        <p><strong>Fecha de registro:</strong> {{ user.date_joined|date:"F d, Y" }}</p>
                        
                        <h5 class="mt-4">Mis Pedidos</h5>
                        <div class="alert alert-info">
                            No tienes pedidos recientes.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
